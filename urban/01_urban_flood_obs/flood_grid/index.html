<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif;color:var(--text,#243247);background:transparent}
.wrap{max-width:450px;margin:auto;padding:2px 5px 4px}#grid{display:grid;grid-template-columns:22px repeat(10,minmax(0,1fr));gap:3px}
.axis{display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--text,#526174)}
.cell{position:relative;aspect-ratio:1;border:1px solid #cbd5e1;border-radius:3px;padding:0;font:inherit;min-width:0;cursor:pointer;color:#10233e}
.cell:disabled{cursor:default;opacity:1}.cell.important{border:2px solid #c2410c}.cell.selected{outline:3px solid #e11d48;outline-offset:-3px}
.cell:focus-visible{outline:3px solid #0f172a;z-index:2}.cell:not(:disabled):hover{filter:brightness(.9);box-shadow:0 0 0 2px #64748b;z-index:1}
.pump{position:absolute;right:1px;top:-4px;font-size:24px;font-weight:bold;color:#e11d48;text-shadow:0 0 2px white;line-height:1}
.sensor{display:inline-block;background:#fde68a;border:1px solid #92400e;border-radius:6px;padding:1px 2px;font-size:clamp(9px,2.1vw,12px);color:#78350f}
#legend{display:flex;align-items:center;gap:7px;margin:8px 0 0 25px;font-size:11px}.ramp{height:10px;width:110px;border:1px solid #cbd5e1}#hint{font-size:12px;min-height:20px;margin:6px 0 0 25px;color:var(--text,#526174)}
</style></head>
<body><div class="wrap"><div id="grid" aria-label="都市の10×10グリッド"></div><div id="legend"></div><div id="hint" aria-live="polite"></div></div>
<script>
let args, pending = null;
const send=(type, data={})=>parent.postMessage({isStreamlitMessage:true,type,...data}, '*');
function height(){send('streamlit:setFrameHeight',{height:document.querySelector('.wrap').getBoundingClientRect().height+4});}
function render(){
 const grid=document.getElementById('grid');
 const focused=document.activeElement?.dataset.cell;
 grid.replaceChildren();
 const axis=t=>{let el=document.createElement('div');el.className='axis';el.textContent=t;grid.appendChild(el);};
 axis('');for(let x=1;x<=10;x++)axis(x);
 args.cells.forEach((cell,i)=>{
  if(i%10===0)axis(String.fromCharCode(65+Math.floor(i/10)));
  let b=document.createElement('button');b.type='button';b.className='cell'+(cell.important?' important':'')+(cell.selected?' selected':'');
  b.style.background=cell.color;b.dataset.cell=i;b.setAttribute('aria-label',cell.name);b.setAttribute('aria-pressed',String(cell.selected));
  b.disabled=!args.interactive || pending!==null;
  b.title=cell.description;
  if(cell.observed!==null){let s=document.createElement('span');s.className='sensor';s.textContent=cell.observed;b.appendChild(s);}
  if(cell.selected){let p=document.createElement('span');p.className='pump';p.textContent='×';p.setAttribute('aria-hidden','true');b.appendChild(p);}
  b.onmouseenter=()=>document.getElementById('hint').textContent=cell.description;
  b.onfocus=()=>document.getElementById('hint').textContent=cell.description;
  b.onclick=()=>{
   if(pending!==null)return;
   pending=crypto.randomUUID();
   send('streamlit:setComponentValue',{value:{cell:i,token:pending},dataType:'json'});
   // Wait for the server's acknowledgement so rapid clicks cannot lose updates.
   grid.querySelectorAll('button').forEach(btn=>btn.disabled=true);
  };
  grid.appendChild(b);
 });
 document.getElementById('legend').innerHTML='';
 let legend=document.getElementById('legend');
 let label=document.createElement('span');label.textContent=args.legend;legend.appendChild(label);
 let ramp=document.createElement('span');ramp.className='ramp';ramp.style.background=args.ramp;legend.appendChild(ramp);
 let end=document.createElement('span');end.textContent=args.range;legend.appendChild(end);
 document.getElementById('hint').textContent=args.interactive?'区画をクリックして選択・解除（最大3台）':'区画にカーソルを置くと表示値を確認できます';
 if(focused!==undefined)grid.querySelector(`[data-cell="${focused}"]`)?.focus({preventScroll:true});
 height();
}
window.addEventListener('message',event=>{
 if(event.source!==parent || event.data.type!=='streamlit:render')return;
 args=event.data.args;
 if(args.ack===pending)pending=null;
 document.body.style.setProperty('--text',event.data.theme?.textColor||'#243247');
 render();
});
new ResizeObserver(height).observe(document.querySelector('.wrap'));
send('streamlit:componentReady',{apiVersion:1});
height();
</script></body></html>
